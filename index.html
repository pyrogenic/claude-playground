<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #8888aa;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.4;
  }
  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  h1 {
    font-size: 14px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #555570;
    font-weight: 300;
  }
  #startBtn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 1px solid #333350;
    background: radial-gradient(circle at 40% 40%, #1a1a2e, #0a0a15);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #555570;
    transition: all 1.5s ease;
    outline: none;
  }
  #startBtn:hover {
    border-color: #555580;
    box-shadow: 0 0 30px rgba(80, 80, 140, 0.15);
  }
  #startBtn.active {
    border-color: #666690;
    box-shadow: 0 0 50px rgba(100, 100, 160, 0.2);
    background: radial-gradient(circle at 40% 40%, #22223a, #0e0e1a);
  }
  .variations {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    opacity: 0;
    transition: opacity 1.5s ease;
    max-width: 340px;
    width: 100%;
    padding: 0 20px;
  }
  .variations.visible { opacity: 1; }
  .variation {
    border: 1px solid #222240;
    border-radius: 8px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 1.2s ease;
    background: rgba(15, 15, 25, 0.6);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .variation:hover {
    border-color: #444468;
  }
  .variation.listening {
    border-color: #555588;
    box-shadow: 0 0 20px rgba(90, 90, 160, 0.15);
    background: rgba(20, 20, 35, 0.8);
  }
  .variation.selected {
    border-color: #7777aa;
    box-shadow: 0 0 30px rgba(100, 100, 180, 0.2);
  }
  .variation .param-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .variation .param-label {
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #444460;
  }
  .variation .param-bar {
    width: 50px;
    height: 3px;
    background: #1a1a30;
    border-radius: 2px;
    overflow: hidden;
  }
  .variation .param-fill {
    height: 100%;
    background: #444468;
    border-radius: 2px;
    transition: width 0.8s ease, background 0.8s ease;
  }
  .variation.listening .param-fill {
    background: #6666aa;
  }
  #pauseBtn {
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555570;
    background: none;
    border: 1px solid #333350;
    border-radius: 4px;
    padding: 5px 14px;
    cursor: pointer;
    outline: none;
    transition: all 0.8s ease;
    opacity: 0;
  }
  #pauseBtn.visible { opacity: 1; }
  #pauseBtn:hover { border-color: #555580; }
  #pauseBtn.paused { color: #6666aa; border-color: #555588; }
  .hint {
    font-size: 9px;
    letter-spacing: 2px;
    color: #333350;
    text-align: center;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .hint.visible { opacity: 1; }
  .cycle-indicator {
    display: flex;
    gap: 6px;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .cycle-indicator.visible { opacity: 1; }
  .cycle-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #222240;
    transition: background 0.8s ease;
  }
  .cycle-dot.active {
    background: #6666aa;
  }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div class="controls">
  <h1>Drone</h1>
  <button id="startBtn">begin</button>
  <div class="variations" id="variations">
    <div class="variation" data-idx="0"></div>
    <div class="variation" data-idx="1"></div>
    <div class="variation" data-idx="2"></div>
    <div class="variation" data-idx="3"></div>
  </div>
  <div class="cycle-indicator" id="cycleIndicator">
    <div class="cycle-dot" data-idx="0"></div>
    <div class="cycle-dot" data-idx="1"></div>
    <div class="cycle-dot" data-idx="2"></div>
    <div class="cycle-dot" data-idx="3"></div>
  </div>
  <button id="pauseBtn">pause</button>
  <div class="hint" id="hint">tap a variation to explore</div>
</div>

<script>
const $ = id => document.getElementById(id);

let ctx, running = false, paused = false;
let masterGain, noiseBuf;
const PARAM_NAMES = ['density', 'shimmer', 'breath', 'drift'];

// Current basis and 4 variations
let basis = { density: 0.5, shimmer: 0.4, breath: 0.6, drift: 0.3 };
let variations = [];
let currentListening = 0;
let cycleTimer = null;

// Active audio per variation slot
const slots = [null, null, null, null];

const FREQ_POOL = [
  220, 233.08, 246.94, 261.63, 277.18, 293.66, 311.13, 329.63,
  349.23, 369.99, 392.00, 415.30, 440, 466.16, 493.88, 523.25,
  554.37, 587.33, 622.25, 659.25, 698.46, 739.99, 783.99, 830.61
];

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function mutate(base, amount) {
  const result = {};
  for (const k of PARAM_NAMES) {
    result[k] = clamp01(base[k] + (Math.random() - 0.5) * amount);
  }
  return result;
}

function generateVariations() {
  variations = [];
  for (let i = 0; i < 4; i++) {
    variations.push(mutate(basis, 0.4));
  }
  renderVariationCards();
}

function renderVariationCards() {
  const cards = document.querySelectorAll('.variation');
  cards.forEach((card, i) => {
    const v = variations[i];
    card.innerHTML = PARAM_NAMES.map(p => `
      <div class="param-row">
        <span class="param-label">${p}</span>
        <div class="param-bar">
          <div class="param-fill" style="width: ${v[p] * 100}%"></div>
        </div>
      </div>
    `).join('');
  });
}

// --- Audio engine ---

function makeNoise(audioCtx) {
  const len = audioCtx.sampleRate * 4;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }
  return buf;
}

function createVoice(audioCtx, dest, freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const pan = audioCtx.createStereoPanner();
  const filter = audioCtx.createBiquadFilter();

  osc.type = Math.random() > 0.8 ? 'triangle' : 'sine';
  osc.frequency.value = freq;
  gain.gain.value = 0;
  pan.pan.value = Math.random() * 2 - 1;
  filter.type = 'bandpass';
  filter.frequency.value = freq;
  filter.Q.value = 0.5 + Math.random() * 2;

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(pan);
  pan.connect(dest);
  osc.start();

  const targetGain = 0.02 + Math.random() * 0.04;
  gain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 4 + Math.random() * 8);

  return { osc, gain, pan, filter, freq, targetGain, alive: true };
}

function createBreathLayer(audioCtx, dest) {
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;

  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 800;

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 1200 + Math.random() * 1800;
  bp.Q.value = 0.3 + Math.random() * 0.8;

  const gain = audioCtx.createGain();
  gain.gain.value = 0;

  const pan = audioCtx.createStereoPanner();
  pan.pan.value = Math.random() * 2 - 1;

  src.connect(hp);
  hp.connect(bp);
  bp.connect(gain);
  gain.connect(pan);
  pan.connect(dest);
  src.start();

  const targetGain = 0.01 + Math.random() * 0.025;
  gain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 3 + Math.random() * 5);

  return { src, hp, bp, gain, pan, targetGain, alive: true };
}

function pickCluster(count) {
  const root = Math.floor(Math.random() * (FREQ_POOL.length - 6));
  const cluster = [];
  for (let i = 0; i < count; i++) {
    const idx = root + Math.floor(Math.random() * 6);
    cluster.push(FREQ_POOL[Math.min(idx, FREQ_POOL.length - 1)] * (Math.random() > 0.15 ? 1 : 2));
  }
  return cluster;
}

// Create a full slot with its own gain envelope, voices, breath, and evolution
function createSlot(params) {
  const slotGain = ctx.createGain();
  slotGain.gain.value = 0;
  slotGain.connect(masterGain);

  const voices = [];
  const breaths = [];

  const voiceCount = 2 + Math.floor(params.density * 4);
  const freqs = pickCluster(voiceCount);
  for (const f of freqs) {
    voices.push(createVoice(ctx, slotGain, f));
  }

  for (let i = 0; i < 2; i++) {
    breaths.push(createBreathLayer(ctx, slotGain));
  }

  let evolveId = null;

  function evolve() {
    if (!running) return;
    const now = ctx.currentTime;

    voices.forEach(v => {
      if (!v.alive) return;
      const driftAmount = params.drift * 3;
      v.osc.frequency.setTargetAtTime(
        v.freq + (Math.random() - 0.5) * driftAmount, now, 8 + Math.random() * 12
      );
      const newPan = Math.max(-1, Math.min(1, v.pan.pan.value + (Math.random() - 0.5) * 0.3));
      v.pan.pan.setTargetAtTime(newPan, now, 5);
      const shimFreq = v.freq * (1 + params.shimmer * (Math.random() - 0.3) * 2);
      v.filter.frequency.setTargetAtTime(shimFreq, now, 3 + Math.random() * 4);
    });

    breaths.forEach(n => {
      if (!n.alive) return;
      n.gain.gain.setTargetAtTime(n.targetGain * params.breath, now, 4);
      n.bp.frequency.setTargetAtTime(1000 + Math.random() * 2000, now, 6 + Math.random() * 6);
      const newPan = Math.max(-1, Math.min(1, n.pan.pan.value + (Math.random() - 0.5) * 0.4));
      n.pan.pan.setTargetAtTime(newPan, now, 4);
    });

    // Ghost note
    if (Math.random() < 0.04 * params.shimmer) {
      const highFreq = FREQ_POOL[Math.floor(FREQ_POOL.length * 0.4) + Math.floor(Math.random() * 6)];
      const ghost = createVoice(ctx, slotGain, highFreq);
      ghost.gain.gain.cancelScheduledValues(now);
      ghost.gain.gain.setValueAtTime(0, now);
      ghost.gain.gain.setTargetAtTime(0.005, now, 3);
      ghost.gain.gain.setTargetAtTime(0, now + 6 + Math.random() * 8, 4);
      ghost.alive = false;
      setTimeout(() => { try { ghost.osc.stop(); } catch(e) {} }, 25000);
    }

    evolveId = setTimeout(evolve, 3000 + Math.random() * 4000);
  }

  evolve();

  return {
    slotGain,
    voices,
    breaths,
    params,
    fadeIn() {
      slotGain.gain.setTargetAtTime(1, ctx.currentTime, 1.5);
    },
    fadeOut() {
      slotGain.gain.setTargetAtTime(0, ctx.currentTime, 1.5);
    },
    destroy() {
      clearTimeout(evolveId);
      slotGain.gain.setTargetAtTime(0, ctx.currentTime, 0.5);
      setTimeout(() => {
        voices.forEach(v => { try { v.osc.stop(); } catch(e) {} });
        breaths.forEach(b => { try { b.src.stop(); } catch(e) {} });
        try { slotGain.disconnect(); } catch(e) {}
      }, 3000);
    }
  };
}

function init() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  noiseBuf = makeNoise(ctx);

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.7;

  const masterHP = ctx.createBiquadFilter();
  masterHP.type = 'highpass';
  masterHP.frequency.value = 180;

  const reverbMix = ctx.createGain();
  reverbMix.gain.value = 0.3;
  const dryMix = ctx.createGain();
  dryMix.gain.value = 0.7;

  [0.037, 0.053, 0.079, 0.113, 0.157, 0.211].forEach(t => {
    const d = ctx.createDelay(1);
    d.delayTime.value = t;
    const fb = ctx.createGain();
    fb.gain.value = 0.4 + Math.random() * 0.2;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 2000 + Math.random() * 2000;
    masterGain.connect(d);
    d.connect(filt);
    filt.connect(fb);
    fb.connect(d);
    filt.connect(reverbMix);
  });

  masterGain.connect(dryMix);

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -24;
  comp.ratio.value = 4;
  comp.attack.value = 0.1;
  comp.release.value = 0.5;

  dryMix.connect(comp);
  reverbMix.connect(comp);
  comp.connect(masterHP);
  masterHP.connect(ctx.destination);

  generateVariations();
  startAllSlots();
  startCycling();
  startVisualization();
}

function startAllSlots() {
  for (let i = 0; i < 4; i++) {
    if (slots[i]) slots[i].destroy();
    slots[i] = createSlot(variations[i]);
  }
  highlightSlot(0);
}

function highlightSlot(idx) {
  currentListening = idx;
  const cards = document.querySelectorAll('.variation');
  const dots = document.querySelectorAll('.cycle-dot');

  for (let i = 0; i < 4; i++) {
    cards[i].classList.toggle('listening', i === idx);
    dots[i].classList.toggle('active', i === idx);
    if (slots[i]) {
      if (i === idx) slots[i].fadeIn();
      else slots[i].fadeOut();
    }
  }
}

function startCycling() {
  clearInterval(cycleTimer);
  cycleTimer = setInterval(() => {
    highlightSlot((currentListening + 1) % 4);
  }, 8000);
}

function selectVariation(idx) {
  basis = { ...variations[idx] };

  // Mark selected briefly
  const cards = document.querySelectorAll('.variation');
  cards[idx].classList.add('selected');
  setTimeout(() => cards[idx].classList.remove('selected'), 600);

  // Tear down only the other slots
  for (let i = 0; i < 4; i++) {
    if (i === idx) continue;
    if (slots[i]) slots[i].destroy();
    slots[i] = null;
  }

  // Keep the chosen one in place, mutate the rest
  const kept = variations[idx];
  for (let i = 0; i < 4; i++) {
    variations[i] = (i === idx) ? { ...kept } : mutate(basis, 0.4);
  }
  renderVariationCards();

  // Small delay so old audio fades before new starts
  setTimeout(() => {
    if (!running) return;
    for (let i = 0; i < 4; i++) {
      if (i === idx) continue;
      slots[i] = createSlot(variations[i]);
    }
    highlightSlot(idx);
    if (!paused) startCycling();
  }, 1500);
}

// Wire up variation clicks
document.querySelectorAll('.variation').forEach(card => {
  card.addEventListener('click', () => {
    if (!running) return;
    const idx = parseInt(card.dataset.idx);
    selectVariation(idx);
  });
});

// Visualization
function startVisualization() {
  const canvas = $('viz');
  const c = canvas.getContext('2d');
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.2,
      r: Math.random() * 2 + 0.5, alpha: Math.random() * 0.3
    });
  }

  function draw() {
    if (!running) return;
    c.fillStyle = 'rgba(10, 10, 15, 0.08)';
    c.fillRect(0, 0, w, h);

    const cur = variations[currentListening] || basis;

    particles.forEach(p => {
      p.x += p.vx + (Math.random() - 0.5) * 0.2 * cur.breath;
      p.y += p.vy + (Math.random() - 0.5) * 0.15;
      p.alpha += (Math.random() - 0.5) * 0.02;
      p.alpha = Math.max(0.02, Math.min(0.25 + cur.shimmer * 0.15, p.alpha));

      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      c.beginPath();
      c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c.fillStyle = `rgba(120, 120, 180, ${p.alpha})`;
      c.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
}

// Start/stop
$('startBtn').addEventListener('click', () => {
  if (!running) {
    running = true;
    $('startBtn').textContent = 'end';
    $('startBtn').classList.add('active');
    $('variations').classList.add('visible');
    $('cycleIndicator').classList.add('visible');
    $('hint').classList.add('visible');
    $('pauseBtn').classList.add('visible');
    paused = false;
    $('pauseBtn').textContent = 'pause';
    $('pauseBtn').classList.remove('paused');
    init();
  } else {
    running = false;
    $('startBtn').textContent = 'begin';
    $('startBtn').classList.remove('active');
    $('variations').classList.remove('visible');
    $('cycleIndicator').classList.remove('visible');
    $('hint').classList.remove('visible');
    $('pauseBtn').classList.remove('visible');
    clearInterval(cycleTimer);
    for (let i = 0; i < 4; i++) {
      if (slots[i]) { slots[i].destroy(); slots[i] = null; }
    }
    if (ctx) { ctx.close(); ctx = null; }
  }
});

$('pauseBtn').addEventListener('click', () => {
  if (!running) return;
  paused = !paused;
  if (paused) {
    clearInterval(cycleTimer);
    $('pauseBtn').textContent = 'cycle';
    $('pauseBtn').classList.add('paused');
  } else {
    startCycling();
    $('pauseBtn').textContent = 'pause';
    $('pauseBtn').classList.remove('paused');
  }
});
</script>
</body>
</html>
