<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #8888aa;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }
  canvas#viz {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.4;
  }
  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px 0 10px;
    width: 100%;
    max-width: 400px;
  }
  h1 {
    font-size: 14px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #555570;
    font-weight: 300;
  }
  .top-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .ctrl-btn {
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555570;
    background: none;
    border: 1px solid #333350;
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    outline: none;
    transition: all 0.8s ease;
  }
  .ctrl-btn:hover { border-color: #555580; }
  .ctrl-btn.active { color: #6666aa; border-color: #555588; }
  #startBtn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 1px solid #333350;
    background: radial-gradient(circle at 40% 40%, #1a1a2e, #0a0a15);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #555570;
    transition: all 1.5s ease;
    outline: none;
  }
  #startBtn:hover {
    border-color: #555580;
    box-shadow: 0 0 30px rgba(80, 80, 140, 0.15);
  }
  #startBtn.active {
    border-color: #666690;
    box-shadow: 0 0 50px rgba(100, 100, 160, 0.2);
    background: radial-gradient(circle at 40% 40%, #22223a, #0e0e1a);
  }
  .grid-wrap {
    width: 100%;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px;
    opacity: 0;
    transition: opacity 1.5s ease;
    scrollbar-width: thin;
    scrollbar-color: #222240 transparent;
  }
  .grid-wrap::-webkit-scrollbar { width: 4px; }
  .grid-wrap::-webkit-scrollbar-track { background: transparent; }
  .grid-wrap::-webkit-scrollbar-thumb { background: #222240; border-radius: 2px; }
  .grid-wrap.visible { opacity: 1; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding-bottom: 12px;
  }
  .cell {
    border: 1px solid #222240;
    border-radius: 8px;
    padding: 8px;
    transition: all 1.0s ease;
    background: rgba(15, 15, 25, 0.6);
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }
  .cell:hover { border-color: #444468; }
  .cell.listening {
    border-color: #555588;
    box-shadow: 0 0 20px rgba(90, 90, 160, 0.15);
    background: rgba(20, 20, 35, 0.8);
  }
  .cell.sticky {
    border-color: #445566;
  }
  .cell.sticky .vote-btn[data-action="up"] {
    color: #6688aa;
  }
  .cell .param-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cell .param-label {
    font-size: 7px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #444460;
  }
  .cell .param-bar {
    width: 45px;
    height: 2px;
    background: #1a1a30;
    border-radius: 1px;
    overflow: hidden;
  }
  .cell .param-fill {
    height: 100%;
    background: #444468;
    border-radius: 1px;
    transition: width 0.8s ease, background 0.8s ease;
  }
  .cell.listening .param-fill { background: #6666aa; }
  .cell canvas.cell-art {
    width: 100%;
    aspect-ratio: 2 / 1;
    border-radius: 4px;
    display: block;
  }
  .params-view { display: flex; flex-direction: column; gap: 3px; }
  .vote-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 2px;
  }
  .vote-btn {
    font-family: inherit;
    font-size: 13px;
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 1px 10px;
    cursor: pointer;
    color: #444460;
    transition: all 0.4s ease;
    outline: none;
    line-height: 1;
  }
  .vote-btn:hover { color: #8888aa; border-color: #444468; }
  .cell.listening .vote-btn { color: #666688; }
  .cell.listening .vote-btn:hover { color: #aaaacc; border-color: #555588; }
  .bottom-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .bottom-row.visible { opacity: 1; }
  .hint {
    font-size: 9px;
    letter-spacing: 2px;
    color: #333350;
  }
  .slider-control {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .slider-control label {
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #444460;
    white-space: nowrap;
  }
  .slider-control input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 60px;
    height: 2px;
    background: #222240;
    outline: none;
    border-radius: 1px;
  }
  .slider-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555580;
    cursor: pointer;
  }
  .slider-control input[type="range"]::-moz-range-thumb {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555580;
    cursor: pointer;
    border: none;
  }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div class="controls">
  <h1>Drone</h1>
  <button id="startBtn">begin</button>
  <div class="grid-wrap" id="gridWrap">
    <div class="grid" id="grid"></div>
  </div>
  <div class="bottom-row" id="bottomRow">
    <button class="ctrl-btn" id="pauseBtn">pause</button>
    <button class="ctrl-btn" id="viewBtn">params</button>
    <button class="ctrl-btn" id="saveBtn">save</button>
    <button class="ctrl-btn" id="loadBtn">load</button>
    <span class="hint">+ keep, &#x2212; reroll</span>
    <div class="slider-control">
      <label>fade</label>
      <input type="range" id="fadeSlider" min="1" max="8" step="0.5" value="3">
    </div>
    <div class="slider-control">
      <label>dwell</label>
      <input type="range" id="dwellSlider" min="6" max="30" step="1" value="12">
    </div>
  </div>
</div>
<input type="file" id="loadFile" accept=".json" style="display:none">

<script>
const $ = id => document.getElementById(id);
const NUM_CELLS = 8;
const PARAM_NAMES = ['density', 'shimmer', 'breath', 'drift', 'chimes'];
const STORAGE_KEY = 'drone-state-v3';

let ctx, running = false, paused = false;
let masterGain, noiseBuf;
let viewMode = 'art'; // 'art' or 'params'
let fadeTime = 3;   // crossfade seconds
let dwellTime = 12; // seconds per cell
let variations = [];
let currentListening = 0;
let cycleTimer = null;
let artAnimId = null;
const slots = new Array(NUM_CELLS).fill(null);

// Diatonic/pentatonic scale degrees rooted on concert pitches.
// These are "safe" consonant intervals — no microtonal wolf tones.
// Major pentatonic on D: D E F# A B across octaves
const SCALE_FREQS = [
  // Octave 3
  293.66, 329.63, 369.99, 440.00, 493.88,
  // Octave 4
  587.33, 659.25, 739.99, 880.00, 987.77
];

// Chime frequencies: high pentatonic, sparkly register
const CHIME_FREQS = [
  1174.66, 1318.51, 1479.98, 1760.00, 1975.53, // octave 6
  2349.32, 2637.02, 2959.96                       // octave 7
];

// --- State persistence ---

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      variations, currentListening, paused, viewMode, fadeTime, dwellTime
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && s.variations && s.variations.length === NUM_CELLS) return s;
  } catch(e) {}
  return null;
}

// --- Variations ---

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function mutate(base, amount) {
  const result = {};
  for (const k of PARAM_NAMES) {
    result[k] = clamp01(base[k] + (Math.random() - 0.5) * amount);
  }
  return result;
}

function generateChain() {
  // Start from a random seed, each cell is a subtle mutation of the previous
  variations = [];
  let current = {
    density: 0.3 + Math.random() * 0.4,
    shimmer: 0.2 + Math.random() * 0.4,
    breath:  0.3 + Math.random() * 0.4,
    drift:   0.1 + Math.random() * 0.4,
    chimes:  Math.random() * 0.5
  };
  for (let i = 0; i < NUM_CELLS; i++) {
    current = (i === 0) ? { ...current } : mutate(current, 0.1);
    variations.push({ ...current });
  }
}

// --- Build DOM ---

function buildGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  for (let i = 0; i < NUM_CELLS; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.idx = i;
    grid.appendChild(cell);
  }
  renderCells();
}

function renderCells() {
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => {
    const v = variations[i];
    if (!v) return;
    if (viewMode === 'params') {
      cell.innerHTML = `
        <div class="params-view">
          ${PARAM_NAMES.map(p => `
            <div class="param-row">
              <span class="param-label">${p}</span>
              <div class="param-bar">
                <div class="param-fill" style="width: ${v[p] * 100}%"></div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="vote-row">
          <button class="vote-btn" data-action="down" data-idx="${i}">&#x2212;</button>
          <button class="vote-btn" data-action="up" data-idx="${i}">+</button>
        </div>
      `;
    } else {
      cell.innerHTML = `
        <canvas class="cell-art" data-idx="${i}" width="160" height="80"></canvas>
        <div class="vote-row">
          <button class="vote-btn" data-action="down" data-idx="${i}">&#x2212;</button>
          <button class="vote-btn" data-action="up" data-idx="${i}">+</button>
        </div>
      `;
    }
  });
  if (viewMode === 'art') drawAllArt();
}

// --- Procedural art per cell ---
// Each cell gets a deterministic-ish visual based on its 4 params.
// We use a seeded approach: hash the params to get a seed, then draw.

// Deterministic pseudo-random from a seed
function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function drawCellArt(canvas, params, isListening, time) {
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  const { density, shimmer, breath, drift, chimes } = params;

  // Deterministic seed from params (quantized so similar params = similar art)
  const q = 40; // quantization level
  const seedVal = (Math.round(density * q) * 10000000
    + Math.round(shimmer * q) * 100000
    + Math.round(breath * q) * 1000
    + Math.round(drift * q) * 10
    + Math.round((chimes || 0) * q));
  const rand = seededRand(seedVal + 1);

  // Background
  c.fillStyle = '#0c0c16';
  c.fillRect(0, 0, w, h);

  // Color palette derived from params
  const baseHue = drift * 280 + 180; // full hue range
  const hue2 = baseHue + 30 + shimmer * 60;
  const hue3 = baseHue - 20 - breath * 40;
  const sat = 35 + shimmer * 35;
  const baseLum = isListening ? 50 : 35;

  // Identicon grid: 10 cols (5 mirrored) x 5 rows
  const cols = 10, halfCols = 5, rows = 5;
  const cellW = w / cols, cellH = h / rows;

  // Generate left half, mirror to right
  for (let gy = 0; gy < rows; gy++) {
    for (let gx = 0; gx < halfCols; gx++) {
      const r = rand();
      // Density controls how many cells are filled
      const threshold = 0.3 + (1 - density) * 0.35;
      if (r > threshold) {
        // Pick from palette
        const colorChoice = rand();
        let hue, lum, alpha;
        if (colorChoice < 0.45) {
          hue = baseHue;
          lum = baseLum + rand() * 15;
          alpha = isListening ? 0.7 : 0.45;
        } else if (colorChoice < 0.75) {
          hue = hue2;
          lum = baseLum - 5 + rand() * 20;
          alpha = isListening ? 0.55 : 0.35;
        } else {
          hue = hue3;
          lum = baseLum + 5 + rand() * 10;
          alpha = isListening ? 0.5 : 0.3;
        }

        const fill = `hsla(${hue}, ${sat}%, ${lum}%, ${alpha})`;
        // Draw on left side
        c.fillStyle = fill;
        c.fillRect(gx * cellW, gy * cellH, cellW - 0.5, cellH - 0.5);
        // Mirror on right side
        c.fillRect((cols - 1 - gx) * cellW + 0.5, gy * cellH, cellW - 0.5, cellH - 0.5);
      }
    }
  }

  // Breath overlay: soft animated glow
  const glowAlpha = 0.03 + breath * 0.06;
  const gx = w * 0.5 + Math.sin(time * 0.4) * w * 0.15 * drift;
  const gy = h * 0.5 + Math.cos(time * 0.3) * h * 0.2 * breath;
  const grad = c.createRadialGradient(gx, gy, 0, gx, gy, w * 0.6);
  grad.addColorStop(0, `hsla(${baseHue}, ${sat}%, 60%, ${glowAlpha})`);
  grad.addColorStop(1, 'transparent');
  c.fillStyle = grad;
  c.fillRect(0, 0, w, h);

  // Shimmer: occasional bright pixels that twinkle
  if (shimmer > 0.2) {
    const sparkCount = Math.floor(shimmer * 8);
    for (let i = 0; i < sparkCount; i++) {
      const phase = Math.sin(time * 2 + i * 1.7 + seedVal * 0.001);
      if (phase > 0.3) {
        const sx = rand() * w;
        const sy = rand() * h;
        c.fillStyle = `hsla(${baseHue + 40}, 50%, 80%, ${phase * 0.3})`;
        c.fillRect(sx, sy, 2, 2);
      }
    }
  }

  // Chimes: small bright diamond shapes, scattered
  const chimesVal = chimes || 0;
  if (chimesVal > 0.1) {
    const chimeCount = Math.floor(chimesVal * 6);
    for (let i = 0; i < chimeCount; i++) {
      const cx = rand() * w;
      const cy = rand() * h;
      const phase = Math.sin(time * 3 + i * 2.3 + seedVal * 0.002);
      const size = 2 + phase * 1.5;
      const alpha = isListening ? 0.4 + phase * 0.3 : 0.15 + phase * 0.1;
      if (alpha > 0.1) {
        c.save();
        c.translate(cx, cy);
        c.rotate(Math.PI / 4);
        c.fillStyle = `hsla(${baseHue + 80}, 60%, 75%, ${alpha})`;
        c.fillRect(-size / 2, -size / 2, size, size);
        c.restore();
      }
    }
  }
}

function drawAllArt() {
  const canvases = document.querySelectorAll('canvas.cell-art');
  const time = performance.now() / 1000;
  canvases.forEach(canvas => {
    const idx = parseInt(canvas.dataset.idx);
    if (variations[idx]) {
      drawCellArt(canvas, variations[idx], idx === currentListening, time);
    }
  });
}

function startArtLoop() {
  cancelAnimationFrame(artAnimId);
  function loop() {
    if (!running) return;
    if (viewMode === 'art') drawAllArt();
    artAnimId = requestAnimationFrame(loop);
  }
  loop();
}

// --- Audio engine ---

function makeNoise(audioCtx) {
  const len = audioCtx.sampleRate * 4;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }
  return buf;
}

function createVoice(audioCtx, dest, freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const pan = audioCtx.createStereoPanner();
  const filter = audioCtx.createBiquadFilter();

  // All sine for softer tone
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.value = 0;
  pan.pan.value = Math.random() * 2 - 1;
  // Gentle lowpass instead of bandpass — removes harshness
  filter.type = 'lowpass';
  filter.frequency.value = freq * 1.5 + 200;
  filter.Q.value = 0.3 + Math.random() * 0.5;

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(pan);
  pan.connect(dest);
  osc.start();

  const targetGain = 0.02 + Math.random() * 0.03;
  gain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 4 + Math.random() * 8);

  return { osc, gain, pan, filter, freq, targetGain, alive: true };
}

function createChime(audioCtx, dest) {
  // Wind chime: short high-register ping with fast decay
  const freq = CHIME_FREQS[Math.floor(Math.random() * CHIME_FREQS.length)];
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const pan = audioCtx.createStereoPanner();
  const filter = audioCtx.createBiquadFilter();

  osc.type = 'sine';
  osc.frequency.value = freq;
  // Slight detune for shimmer
  osc.detune.value = (Math.random() - 0.5) * 15;
  gain.gain.value = 0;
  pan.pan.value = Math.random() * 2 - 1;
  filter.type = 'bandpass';
  filter.frequency.value = freq;
  filter.Q.value = 8 + Math.random() * 8; // resonant ping

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(pan);
  pan.connect(dest);

  const now = audioCtx.currentTime;
  const delay = Math.random() * 0.3; // slight stagger
  osc.start(now + delay);

  // Quick attack, slow-ish decay
  gain.gain.setValueAtTime(0, now + delay);
  gain.gain.linearRampToValueAtTime(0.02 + Math.random() * 0.015, now + delay + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 2 + Math.random() * 2.5);

  const stopTime = delay + 4;
  osc.stop(now + stopTime);
}

function createBreathLayer(audioCtx, dest) {
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;

  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 800;

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 1200 + Math.random() * 1800;
  bp.Q.value = 0.3 + Math.random() * 0.8;

  const gain = audioCtx.createGain();
  gain.gain.value = 0;

  const pan = audioCtx.createStereoPanner();
  pan.pan.value = Math.random() * 2 - 1;

  src.connect(hp);
  hp.connect(bp);
  bp.connect(gain);
  gain.connect(pan);
  pan.connect(dest);
  src.start();

  const targetGain = 0.01 + Math.random() * 0.025;
  gain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 3 + Math.random() * 5);

  return { src, hp, bp, gain, pan, targetGain, alive: true };
}

function pickCluster(count) {
  // Pick from pentatonic scale — always consonant
  const root = Math.floor(Math.random() * (SCALE_FREQS.length - 3));
  const cluster = [];
  for (let i = 0; i < count; i++) {
    const idx = root + Math.floor(Math.random() * 4);
    cluster.push(SCALE_FREQS[Math.min(idx, SCALE_FREQS.length - 1)]);
  }
  return cluster;
}

function createSlot(params) {
  const slotGain = ctx.createGain();
  slotGain.gain.value = 0;
  slotGain.connect(masterGain);

  const voices = [];
  const breaths = [];

  const voiceCount = 2 + Math.floor(params.density * 4);
  const freqs = pickCluster(voiceCount);
  for (const f of freqs) voices.push(createVoice(ctx, slotGain, f));
  for (let i = 0; i < 2; i++) breaths.push(createBreathLayer(ctx, slotGain));

  let evolveId = null;

  function evolve() {
    if (!running) return;
    const now = ctx.currentTime;

    voices.forEach(v => {
      if (!v.alive) return;
      // Gentle drift: stay near consonant tones
      const driftHz = params.drift * 2;
      v.osc.frequency.setTargetAtTime(
        v.freq + (Math.random() - 0.5) * driftHz, now, 10 + Math.random() * 15
      );
      const newPan = Math.max(-1, Math.min(1, v.pan.pan.value + (Math.random() - 0.5) * 0.2));
      v.pan.pan.setTargetAtTime(newPan, now, 6);
      // Gentle filter modulation
      const shimFreq = v.freq * (1.2 + params.shimmer * 0.8);
      v.filter.frequency.setTargetAtTime(shimFreq, now, 4 + Math.random() * 5);
    });

    breaths.forEach(n => {
      if (!n.alive) return;
      n.gain.gain.setTargetAtTime(n.targetGain * params.breath, now, 5);
      n.bp.frequency.setTargetAtTime(1000 + Math.random() * 2000, now, 8 + Math.random() * 6);
      const newPan = Math.max(-1, Math.min(1, n.pan.pan.value + (Math.random() - 0.5) * 0.3));
      n.pan.pan.setTargetAtTime(newPan, now, 5);
    });

    // Ghost melodic hint — uses scale tones, always consonant
    if (Math.random() < 0.03 * params.shimmer) {
      const ghostFreq = SCALE_FREQS[Math.floor(Math.random() * SCALE_FREQS.length)];
      const ghost = createVoice(ctx, slotGain, ghostFreq);
      ghost.gain.gain.cancelScheduledValues(now);
      ghost.gain.gain.setValueAtTime(0, now);
      ghost.gain.gain.setTargetAtTime(0.004, now, 4);
      ghost.gain.gain.setTargetAtTime(0, now + 8 + Math.random() * 10, 5);
      ghost.alive = false;
      setTimeout(() => { try { ghost.osc.stop(); } catch(e) {} }, 30000);
    }

    // Wind chimes — occasional tinklings, 1-3 at a time
    if (params.chimes > 0.05 && Math.random() < 0.08 * params.chimes) {
      const count = 1 + Math.floor(Math.random() * 2 * params.chimes);
      for (let c = 0; c < count; c++) {
        createChime(ctx, slotGain);
      }
    }

    evolveId = setTimeout(evolve, 3000 + Math.random() * 4000);
  }

  evolve();

  return {
    slotGain, voices, breaths, params,
    fadeIn() { slotGain.gain.setTargetAtTime(1, ctx.currentTime, fadeTime); },
    fadeOut() { slotGain.gain.setTargetAtTime(0, ctx.currentTime, fadeTime); },
    destroy() {
      clearTimeout(evolveId);
      slotGain.gain.setTargetAtTime(0, ctx.currentTime, 0.5);
      setTimeout(() => {
        voices.forEach(v => { try { v.osc.stop(); } catch(e) {} });
        breaths.forEach(b => { try { b.src.stop(); } catch(e) {} });
        try { slotGain.disconnect(); } catch(e) {}
      }, 3000);
    }
  };
}

// --- Orchestration ---

function init() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  noiseBuf = makeNoise(ctx);

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.7;

  const masterHP = ctx.createBiquadFilter();
  masterHP.type = 'highpass';
  masterHP.frequency.value = 180;

  const reverbMix = ctx.createGain();
  reverbMix.gain.value = 0.3;
  const dryMix = ctx.createGain();
  dryMix.gain.value = 0.7;

  [0.037, 0.053, 0.079, 0.113, 0.157, 0.211].forEach(t => {
    const d = ctx.createDelay(1);
    d.delayTime.value = t;
    const fb = ctx.createGain();
    fb.gain.value = 0.4 + Math.random() * 0.2;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 1500 + Math.random() * 1500;
    masterGain.connect(d);
    d.connect(filt);
    filt.connect(fb);
    fb.connect(d);
    filt.connect(reverbMix);
  });

  masterGain.connect(dryMix);

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -24;
  comp.ratio.value = 4;
  comp.attack.value = 0.1;
  comp.release.value = 0.5;

  dryMix.connect(comp);
  reverbMix.connect(comp);
  comp.connect(masterHP);
  masterHP.connect(ctx.destination);

  if (variations.length !== NUM_CELLS) generateChain();
  buildGrid();
  startAllSlots();
  if (!paused) startCycling();
  startVisualization();
  startArtLoop();
}

function startAllSlots() {
  for (let i = 0; i < NUM_CELLS; i++) {
    if (slots[i]) slots[i].destroy();
    slots[i] = createSlot(variations[i]);
  }
  highlightSlot(currentListening);
}

function highlightSlot(idx) {
  currentListening = idx;
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => cell.classList.toggle('listening', i === idx));
  for (let i = 0; i < NUM_CELLS; i++) {
    if (slots[i]) {
      if (i === idx) slots[i].fadeIn();
      else slots[i].fadeOut();
    }
  }
  updateStickyClasses();
  const activeCell = cells[idx];
  if (activeCell) activeCell.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  saveState();
}

function startCycling() {
  clearInterval(cycleTimer);
  cycleTimer = setInterval(() => {
    highlightSlot((currentListening + 1) % NUM_CELLS);
  }, dwellTime * 1000);
}

// Upvote: keep this cell, reroll all others as a chain from it
// Upvote: mark sticky, gently regenerate 2-3 nearest non-sticky neighbors
function selectVariation(idx) {
  variations[idx].sticky = true;

  // Determine which neighbors to regenerate (up to 2 in each direction, skip sticky)
  const toRegen = [];
  for (let d = 1; d <= 3; d++) {
    const fwd = idx + d, bck = idx - d;
    if (fwd < NUM_CELLS && !variations[fwd].sticky) toRegen.push(fwd);
    if (bck >= 0 && !variations[bck].sticky) toRegen.push(bck);
  }

  // Tear down and regenerate only those
  for (const i of toRegen) {
    if (slots[i]) slots[i].destroy();
    slots[i] = null;
    // Mutate from nearest neighbor toward the upvoted cell
    const toward = i < idx ? i + 1 : i - 1;
    const dist = Math.abs(i - idx);
    variations[i] = mutate(variations[toward], 0.06 + dist * 0.03);
  }

  renderCells();
  updateStickyClasses();
  saveState();

  setTimeout(() => {
    if (!running) return;
    for (const i of toRegen) {
      slots[i] = createSlot(variations[i]);
      if (currentListening === i) slots[i].fadeIn();
    }
    if (!paused) startCycling();
  }, 1000);
}

// Downvote: reroll this cell from neighbor (unless sticky — unstick first)
function rejectVariation(idx) {
  // First tap on sticky: just unstick, keep the sound
  if (variations[idx].sticky) {
    variations[idx].sticky = false;
    updateStickyClasses();
    saveState();
    return;
  }

  if (slots[idx]) slots[idx].destroy();
  slots[idx] = null;

  // Mutate from nearest neighbor
  const neighbor = idx > 0 ? variations[idx - 1] : variations[idx + 1];
  variations[idx] = mutate(neighbor, 0.12);
  renderCells();
  updateStickyClasses();
  saveState();

  // Reset cycle timer so user gets full listen time
  if (!paused) startCycling();

  setTimeout(() => {
    if (!running) return;
    slots[idx] = createSlot(variations[idx]);
    if (currentListening === idx) slots[idx].fadeIn();
  }, 1000);
}

function updateStickyClasses() {
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => {
    cell.classList.toggle('sticky', !!(variations[i] && variations[i].sticky));
  });
}

// --- Event delegation ---

$('grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.vote-btn');
  if (!btn || !running) return;
  const idx = parseInt(btn.dataset.idx);
  if (btn.dataset.action === 'up') selectVariation(idx);
  else rejectVariation(idx);
});

// --- Background visualization ---

function startVisualization() {
  const canvas = $('viz');
  const c = canvas.getContext('2d');
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.2,
      r: Math.random() * 2 + 0.5, alpha: Math.random() * 0.3
    });
  }

  function draw() {
    if (!running) return;
    c.fillStyle = 'rgba(10, 10, 15, 0.08)';
    c.fillRect(0, 0, w, h);

    const cur = variations[currentListening] || { breath: 0.5, shimmer: 0.3 };

    particles.forEach(p => {
      p.x += p.vx + (Math.random() - 0.5) * 0.2 * cur.breath;
      p.y += p.vy + (Math.random() - 0.5) * 0.15;
      p.alpha += (Math.random() - 0.5) * 0.02;
      p.alpha = Math.max(0.02, Math.min(0.25 + cur.shimmer * 0.15, p.alpha));

      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      c.beginPath();
      c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c.fillStyle = `rgba(120, 120, 180, ${p.alpha})`;
      c.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
}

// --- Controls ---

$('startBtn').addEventListener('click', () => {
  if (!running) {
    running = true;
    $('startBtn').textContent = 'end';
    $('startBtn').classList.add('active');
    $('gridWrap').classList.add('visible');
    $('bottomRow').classList.add('visible');
    const saved = loadState();
    if (saved) {
      paused = saved.paused;
      viewMode = saved.viewMode || 'art';
      fadeTime = saved.fadeTime || 3;
      dwellTime = saved.dwellTime || 12;
    }
    $('pauseBtn').textContent = paused ? 'cycle' : 'pause';
    $('pauseBtn').classList.toggle('active', paused);
    $('viewBtn').textContent = viewMode === 'art' ? 'params' : 'art';
    $('fadeSlider').value = fadeTime;
    $('dwellSlider').value = dwellTime;
    init();
  } else {
    running = false;
    $('startBtn').textContent = 'begin';
    $('startBtn').classList.remove('active');
    $('gridWrap').classList.remove('visible');
    $('bottomRow').classList.remove('visible');
    clearInterval(cycleTimer);
    cancelAnimationFrame(artAnimId);
    for (let i = 0; i < NUM_CELLS; i++) {
      if (slots[i]) { slots[i].destroy(); slots[i] = null; }
    }
    if (ctx) { ctx.close(); ctx = null; }
  }
});

$('pauseBtn').addEventListener('click', () => {
  if (!running) return;
  paused = !paused;
  if (paused) {
    clearInterval(cycleTimer);
    $('pauseBtn').textContent = 'cycle';
    $('pauseBtn').classList.add('active');
  } else {
    startCycling();
    $('pauseBtn').textContent = 'pause';
    $('pauseBtn').classList.remove('active');
  }
  saveState();
});

$('viewBtn').addEventListener('click', () => {
  if (!running) return;
  viewMode = viewMode === 'art' ? 'params' : 'art';
  $('viewBtn').textContent = viewMode === 'art' ? 'params' : 'art';
  renderCells();
  // Re-apply listening state
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => cell.classList.toggle('listening', i === currentListening));
  saveState();
});

$('fadeSlider').addEventListener('input', () => {
  fadeTime = parseFloat($('fadeSlider').value);
  saveState();
});

$('dwellSlider').addEventListener('input', () => {
  dwellTime = parseFloat($('dwellSlider').value);
  if (!paused) startCycling();
  saveState();
});

$('saveBtn').addEventListener('click', () => {
  if (!running) return;
  const data = JSON.stringify({ variations, currentListening, paused, viewMode, fadeTime, dwellTime }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `drone-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

$('loadBtn').addEventListener('click', () => {
  $('loadFile').click();
});

$('loadFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const s = JSON.parse(ev.target.result);
      if (!s || !s.variations || s.variations.length !== NUM_CELLS) return;
      variations = s.variations;
      currentListening = s.currentListening || 0;
      paused = s.paused || false;
      viewMode = s.viewMode || 'art';
      fadeTime = s.fadeTime || 3;
      dwellTime = s.dwellTime || 12;
      saveState();
      if (running) {
        for (let i = 0; i < NUM_CELLS; i++) {
          if (slots[i]) { slots[i].destroy(); slots[i] = null; }
        }
        buildGrid();
        startAllSlots();
        highlightSlot(currentListening);
        if (!paused) startCycling();
        $('pauseBtn').textContent = paused ? 'cycle' : 'pause';
        $('pauseBtn').classList.toggle('active', paused);
        $('viewBtn').textContent = viewMode === 'art' ? 'params' : 'art';
        $('fadeSlider').value = fadeTime;
        $('dwellSlider').value = dwellTime;
      }
    } catch(err) {}
    e.target.value = '';
  };
  reader.readAsText(file);
});
</script>
</body>
