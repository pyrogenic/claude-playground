<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #8888aa;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }
  canvas#viz {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.4;
  }
  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px 0 10px;
    width: 100%;
    max-width: 400px;
  }
  h1 {
    font-size: 14px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #555570;
    font-weight: 300;
  }
  .top-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .ctrl-btn {
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555570;
    background: none;
    border: 1px solid #333350;
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    outline: none;
    transition: all 0.8s ease;
  }
  .ctrl-btn:hover { border-color: #555580; }
  .ctrl-btn.active { color: #6666aa; border-color: #555588; }
  #startBtn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 1px solid #333350;
    background: radial-gradient(circle at 40% 40%, #1a1a2e, #0a0a15);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #555570;
    transition: all 1.5s ease;
    outline: none;
  }
  #startBtn:hover {
    border-color: #555580;
    box-shadow: 0 0 30px rgba(80, 80, 140, 0.15);
  }
  #startBtn.active {
    border-color: #666690;
    box-shadow: 0 0 50px rgba(100, 100, 160, 0.2);
    background: radial-gradient(circle at 40% 40%, #22223a, #0e0e1a);
  }
  .grid-wrap {
    width: 100%;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px;
    opacity: 0;
    transition: opacity 1.5s ease;
    scrollbar-width: thin;
    scrollbar-color: #222240 transparent;
  }
  .grid-wrap::-webkit-scrollbar { width: 4px; }
  .grid-wrap::-webkit-scrollbar-track { background: transparent; }
  .grid-wrap::-webkit-scrollbar-thumb { background: #222240; border-radius: 2px; }
  .grid-wrap.visible { opacity: 1; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding-bottom: 12px;
  }
  .cell {
    border: 1px solid #222240;
    border-radius: 8px;
    padding: 8px;
    transition: all 1.0s ease;
    background: rgba(15, 15, 25, 0.6);
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }
  .cell:hover { border-color: #444468; }
  .cell.listening {
    border-color: #555588;
    box-shadow: 0 0 20px rgba(90, 90, 160, 0.15);
    background: rgba(20, 20, 35, 0.8);
  }
  .cell .param-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cell .param-label {
    font-size: 7px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #444460;
  }
  .cell .param-bar {
    width: 45px;
    height: 2px;
    background: #1a1a30;
    border-radius: 1px;
    overflow: hidden;
  }
  .cell .param-fill {
    height: 100%;
    background: #444468;
    border-radius: 1px;
    transition: width 0.8s ease, background 0.8s ease;
  }
  .cell.listening .param-fill { background: #6666aa; }
  .cell canvas.cell-art {
    width: 100%;
    aspect-ratio: 2 / 1;
    border-radius: 4px;
    display: block;
  }
  .params-view { display: flex; flex-direction: column; gap: 3px; }
  .vote-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 2px;
  }
  .vote-btn {
    font-family: inherit;
    font-size: 13px;
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 1px 10px;
    cursor: pointer;
    color: #444460;
    transition: all 0.4s ease;
    outline: none;
    line-height: 1;
  }
  .vote-btn:hover { color: #8888aa; border-color: #444468; }
  .cell.listening .vote-btn { color: #666688; }
  .cell.listening .vote-btn:hover { color: #aaaacc; border-color: #555588; }
  .bottom-row {
    display: flex;
    gap: 8px;
    align-items: center;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .bottom-row.visible { opacity: 1; }
  .hint {
    font-size: 9px;
    letter-spacing: 2px;
    color: #333350;
  }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div class="controls">
  <h1>Drone</h1>
  <button id="startBtn">begin</button>
  <div class="grid-wrap" id="gridWrap">
    <div class="grid" id="grid"></div>
  </div>
  <div class="bottom-row" id="bottomRow">
    <button class="ctrl-btn" id="pauseBtn">pause</button>
    <button class="ctrl-btn" id="viewBtn">art</button>
    <span class="hint">+ keep, &#x2212; reroll</span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const NUM_CELLS = 8;
const PARAM_NAMES = ['density', 'shimmer', 'breath', 'drift'];
const STORAGE_KEY = 'drone-state-v2';
const CYCLE_TIME = 8000;

let ctx, running = false, paused = false;
let masterGain, noiseBuf;
let viewMode = 'art'; // 'art' or 'params'
let variations = [];
let currentListening = 0;
let cycleTimer = null;
let artAnimId = null;
const slots = new Array(NUM_CELLS).fill(null);

const FREQ_POOL = [
  220, 233.08, 246.94, 261.63, 277.18, 293.66, 311.13, 329.63,
  349.23, 369.99, 392.00, 415.30, 440, 466.16, 493.88, 523.25,
  554.37, 587.33, 622.25, 659.25, 698.46, 739.99, 783.99, 830.61
];

// --- State persistence ---

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      variations, currentListening, paused, viewMode
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && s.variations && s.variations.length === NUM_CELLS) return s;
  } catch(e) {}
  return null;
}

// --- Variations ---

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function mutate(base, amount) {
  const result = {};
  for (const k of PARAM_NAMES) {
    result[k] = clamp01(base[k] + (Math.random() - 0.5) * amount);
  }
  return result;
}

function generateChain() {
  // Start from a random seed, each cell is a subtle mutation of the previous
  variations = [];
  let current = {
    density: 0.3 + Math.random() * 0.4,
    shimmer: 0.2 + Math.random() * 0.4,
    breath:  0.3 + Math.random() * 0.4,
    drift:   0.1 + Math.random() * 0.4
  };
  for (let i = 0; i < NUM_CELLS; i++) {
    current = (i === 0) ? { ...current } : mutate(current, 0.2);
    variations.push({ ...current });
  }
}

// --- Build DOM ---

function buildGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  for (let i = 0; i < NUM_CELLS; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.idx = i;
    grid.appendChild(cell);
  }
  renderCells();
}

function renderCells() {
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => {
    const v = variations[i];
    if (!v) return;
    if (viewMode === 'params') {
      cell.innerHTML = `
        <div class="params-view">
          ${PARAM_NAMES.map(p => `
            <div class="param-row">
              <span class="param-label">${p}</span>
              <div class="param-bar">
                <div class="param-fill" style="width: ${v[p] * 100}%"></div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="vote-row">
          <button class="vote-btn" data-action="down" data-idx="${i}">&#x2212;</button>
          <button class="vote-btn" data-action="up" data-idx="${i}">+</button>
        </div>
      `;
    } else {
      cell.innerHTML = `
        <canvas class="cell-art" data-idx="${i}" width="160" height="80"></canvas>
        <div class="vote-row">
          <button class="vote-btn" data-action="down" data-idx="${i}">&#x2212;</button>
          <button class="vote-btn" data-action="up" data-idx="${i}">+</button>
        </div>
      `;
    }
  });
  if (viewMode === 'art') drawAllArt();
}

// --- Procedural art per cell ---
// Each cell gets a deterministic-ish visual based on its 4 params.
// We use a seeded approach: hash the params to get a seed, then draw.

function drawCellArt(canvas, params, isListening, time) {
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  c.fillStyle = '#0a0a14';
  c.fillRect(0, 0, w, h);

  const { density, shimmer, breath, drift } = params;

  // Layer 1: soft gradient bands driven by density and drift
  const bandCount = 3 + Math.floor(density * 6);
  for (let i = 0; i < bandCount; i++) {
    const t = i / bandCount;
    const y = h * t + Math.sin(t * 6.28 + drift * 10 + time * 0.3) * h * 0.08 * breath;
    const alpha = 0.04 + shimmer * 0.06;
    const hue = 220 + drift * 60 + i * 8;
    const sat = 20 + shimmer * 40;
    c.fillStyle = `hsla(${hue}, ${sat}%, ${35 + shimmer * 20}%, ${alpha})`;
    c.fillRect(0, y - 4, w, 8 + density * 4);
  }

  // Layer 2: floating particles
  const particleCount = 4 + Math.floor(density * 12);
  const seed = density * 1000 + shimmer * 100 + breath * 10 + drift;
  for (let i = 0; i < particleCount; i++) {
    const pseudo = Math.sin(seed * (i + 1) * 127.1 + i * 311.7) * 0.5 + 0.5;
    const pseudo2 = Math.sin(seed * (i + 1) * 269.5 + i * 183.3) * 0.5 + 0.5;
    const x = pseudo * w + Math.sin(time * 0.5 + i) * drift * 8;
    const y = pseudo2 * h + Math.cos(time * 0.4 + i * 0.7) * breath * 6;
    const r = 1 + shimmer * 3 + pseudo * 2;
    const alpha = isListening ? 0.15 + shimmer * 0.25 : 0.06 + shimmer * 0.1;
    const hue = 230 + drift * 50 + pseudo * 30;
    c.beginPath();
    c.arc(((x % w) + w) % w, ((y % h) + h) % h, r, 0, Math.PI * 2);
    c.fillStyle = `hsla(${hue}, ${30 + shimmer * 30}%, ${50 + shimmer * 20}%, ${alpha})`;
    c.fill();
  }

  // Layer 3: breath waves
  c.strokeStyle = `hsla(${240 + drift * 30}, ${20 + shimmer * 30}%, 50%, ${isListening ? 0.12 : 0.05})`;
  c.lineWidth = 0.5 + breath;
  c.beginPath();
  for (let x = 0; x < w; x++) {
    const freq1 = 0.02 + density * 0.03;
    const freq2 = 0.05 + shimmer * 0.04;
    const y = h * 0.5
      + Math.sin(x * freq1 + time * 0.6 + drift * 5) * h * 0.15 * breath
      + Math.sin(x * freq2 + time * 0.3) * h * 0.08 * shimmer;
    x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
  }
  c.stroke();

  // Subtle border glow when listening
  if (isListening) {
    c.strokeStyle = `hsla(250, 30%, 60%, 0.08)`;
    c.lineWidth = 2;
    c.strokeRect(1, 1, w - 2, h - 2);
  }
}

function drawAllArt() {
  const canvases = document.querySelectorAll('canvas.cell-art');
  const time = performance.now() / 1000;
  canvases.forEach(canvas => {
    const idx = parseInt(canvas.dataset.idx);
    if (variations[idx]) {
      drawCellArt(canvas, variations[idx], idx === currentListening, time);
    }
  });
}

function startArtLoop() {
  cancelAnimationFrame(artAnimId);
  function loop() {
    if (!running) return;
    if (viewMode === 'art') drawAllArt();
    artAnimId = requestAnimationFrame(loop);
  }
  loop();
}

// --- Audio engine ---

function makeNoise(audioCtx) {
  const len = audioCtx.sampleRate * 4;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }
  return buf;
}

function createVoice(audioCtx, dest, freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const pan = audioCtx.createStereoPanner();
  const filter = audioCtx.createBiquadFilter();

  osc.type = Math.random() > 0.8 ? 'triangle' : 'sine';
  osc.frequency.value = freq;
  gain.gain.value = 0;
  pan.pan.value = Math.random() * 2 - 1;
  filter.type = 'bandpass';
  filter.frequency.value = freq;
  filter.Q.value = 0.5 + Math.random() * 2;

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(pan);
  pan.connect(dest);
  osc.start();

  const targetGain = 0.02 + Math.random() * 0.04;
  gain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 4 + Math.random() * 8);

  return { osc, gain, pan, filter, freq, targetGain, alive: true };
}

function createBreathLayer(audioCtx, dest) {
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;

  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 800;

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 1200 + Math.random() * 1800;
  bp.Q.value = 0.3 + Math.random() * 0.8;

  const gain = audioCtx.createGain();
  gain.gain.value = 0;

  const pan = audioCtx.createStereoPanner();
  pan.pan.value = Math.random() * 2 - 1;

  src.connect(hp);
  hp.connect(bp);
  bp.connect(gain);
  gain.connect(pan);
  pan.connect(dest);
  src.start();

  const targetGain = 0.01 + Math.random() * 0.025;
  gain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 3 + Math.random() * 5);

  return { src, hp, bp, gain, pan, targetGain, alive: true };
}

function pickCluster(count) {
  const root = Math.floor(Math.random() * (FREQ_POOL.length - 6));
  const cluster = [];
  for (let i = 0; i < count; i++) {
    const idx = root + Math.floor(Math.random() * 6);
    cluster.push(FREQ_POOL[Math.min(idx, FREQ_POOL.length - 1)] * (Math.random() > 0.15 ? 1 : 2));
  }
  return cluster;
}

function createSlot(params) {
  const slotGain = ctx.createGain();
  slotGain.gain.value = 0;
  slotGain.connect(masterGain);

  const voices = [];
  const breaths = [];

  const voiceCount = 2 + Math.floor(params.density * 4);
  const freqs = pickCluster(voiceCount);
  for (const f of freqs) voices.push(createVoice(ctx, slotGain, f));
  for (let i = 0; i < 2; i++) breaths.push(createBreathLayer(ctx, slotGain));

  let evolveId = null;

  function evolve() {
    if (!running) return;
    const now = ctx.currentTime;

    voices.forEach(v => {
      if (!v.alive) return;
      v.osc.frequency.setTargetAtTime(
        v.freq + (Math.random() - 0.5) * params.drift * 3, now, 8 + Math.random() * 12
      );
      const newPan = Math.max(-1, Math.min(1, v.pan.pan.value + (Math.random() - 0.5) * 0.3));
      v.pan.pan.setTargetAtTime(newPan, now, 5);
      const shimFreq = v.freq * (1 + params.shimmer * (Math.random() - 0.3) * 2);
      v.filter.frequency.setTargetAtTime(shimFreq, now, 3 + Math.random() * 4);
    });

    breaths.forEach(n => {
      if (!n.alive) return;
      n.gain.gain.setTargetAtTime(n.targetGain * params.breath, now, 4);
      n.bp.frequency.setTargetAtTime(1000 + Math.random() * 2000, now, 6 + Math.random() * 6);
      const newPan = Math.max(-1, Math.min(1, n.pan.pan.value + (Math.random() - 0.5) * 0.4));
      n.pan.pan.setTargetAtTime(newPan, now, 4);
    });

    if (Math.random() < 0.04 * params.shimmer) {
      const highFreq = FREQ_POOL[Math.floor(FREQ_POOL.length * 0.4) + Math.floor(Math.random() * 6)];
      const ghost = createVoice(ctx, slotGain, highFreq);
      ghost.gain.gain.cancelScheduledValues(now);
      ghost.gain.gain.setValueAtTime(0, now);
      ghost.gain.gain.setTargetAtTime(0.005, now, 3);
      ghost.gain.gain.setTargetAtTime(0, now + 6 + Math.random() * 8, 4);
      ghost.alive = false;
      setTimeout(() => { try { ghost.osc.stop(); } catch(e) {} }, 25000);
    }

    evolveId = setTimeout(evolve, 3000 + Math.random() * 4000);
  }

  evolve();

  return {
    slotGain, voices, breaths, params,
    fadeIn() { slotGain.gain.setTargetAtTime(1, ctx.currentTime, 1.5); },
    fadeOut() { slotGain.gain.setTargetAtTime(0, ctx.currentTime, 1.5); },
    destroy() {
      clearTimeout(evolveId);
      slotGain.gain.setTargetAtTime(0, ctx.currentTime, 0.5);
      setTimeout(() => {
        voices.forEach(v => { try { v.osc.stop(); } catch(e) {} });
        breaths.forEach(b => { try { b.src.stop(); } catch(e) {} });
        try { slotGain.disconnect(); } catch(e) {}
      }, 3000);
    }
  };
}

// --- Orchestration ---

function init() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  noiseBuf = makeNoise(ctx);

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.7;

  const masterHP = ctx.createBiquadFilter();
  masterHP.type = 'highpass';
  masterHP.frequency.value = 180;

  const reverbMix = ctx.createGain();
  reverbMix.gain.value = 0.3;
  const dryMix = ctx.createGain();
  dryMix.gain.value = 0.7;

  [0.037, 0.053, 0.079, 0.113, 0.157, 0.211].forEach(t => {
    const d = ctx.createDelay(1);
    d.delayTime.value = t;
    const fb = ctx.createGain();
    fb.gain.value = 0.4 + Math.random() * 0.2;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 2000 + Math.random() * 2000;
    masterGain.connect(d);
    d.connect(filt);
    filt.connect(fb);
    fb.connect(d);
    filt.connect(reverbMix);
  });

  masterGain.connect(dryMix);

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -24;
  comp.ratio.value = 4;
  comp.attack.value = 0.1;
  comp.release.value = 0.5;

  dryMix.connect(comp);
  reverbMix.connect(comp);
  comp.connect(masterHP);
  masterHP.connect(ctx.destination);

  if (variations.length !== NUM_CELLS) generateChain();
  buildGrid();
  startAllSlots();
  if (!paused) startCycling();
  startVisualization();
  startArtLoop();
}

function startAllSlots() {
  for (let i = 0; i < NUM_CELLS; i++) {
    if (slots[i]) slots[i].destroy();
    slots[i] = createSlot(variations[i]);
  }
  highlightSlot(currentListening);
}

function highlightSlot(idx) {
  currentListening = idx;
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => cell.classList.toggle('listening', i === idx));
  for (let i = 0; i < NUM_CELLS; i++) {
    if (slots[i]) {
      if (i === idx) slots[i].fadeIn();
      else slots[i].fadeOut();
    }
  }
  // Scroll the active cell into view
  const activeCell = cells[idx];
  if (activeCell) activeCell.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  saveState();
}

function startCycling() {
  clearInterval(cycleTimer);
  cycleTimer = setInterval(() => {
    highlightSlot((currentListening + 1) % NUM_CELLS);
  }, CYCLE_TIME);
}

// Upvote: keep this cell, reroll all others as a chain from it
function selectVariation(idx) {
  const kept = { ...variations[idx] };

  // Tear down other slots
  for (let i = 0; i < NUM_CELLS; i++) {
    if (i === idx) continue;
    if (slots[i]) slots[i].destroy();
    slots[i] = null;
  }

  // Rebuild chain: idx stays, walk outward in both directions
  variations[idx] = kept;
  // Forward from idx
  for (let i = idx + 1; i < NUM_CELLS; i++) {
    variations[i] = mutate(variations[i - 1], 0.15);
  }
  // Backward from idx
  for (let i = idx - 1; i >= 0; i--) {
    variations[i] = mutate(variations[i + 1], 0.15);
  }

  renderCells();
  saveState();

  setTimeout(() => {
    if (!running) return;
    for (let i = 0; i < NUM_CELLS; i++) {
      if (i === idx) continue;
      slots[i] = createSlot(variations[i]);
    }
    highlightSlot(idx);
    if (!paused) startCycling();
  }, 1500);
}

// Downvote: reroll just this cell from its neighbors
function rejectVariation(idx) {
  if (slots[idx]) slots[idx].destroy();
  slots[idx] = null;

  // Mutate from a neighbor
  const neighbor = idx > 0 ? variations[idx - 1] : variations[idx + 1];
  variations[idx] = mutate(neighbor, 0.2);
  renderCells();
  saveState();

  setTimeout(() => {
    if (!running) return;
    slots[idx] = createSlot(variations[idx]);
    if (currentListening === idx) slots[idx].fadeIn();
  }, 1000);
}

// --- Event delegation ---

$('grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.vote-btn');
  if (!btn || !running) return;
  const idx = parseInt(btn.dataset.idx);
  if (btn.dataset.action === 'up') selectVariation(idx);
  else rejectVariation(idx);
});

// --- Background visualization ---

function startVisualization() {
  const canvas = $('viz');
  const c = canvas.getContext('2d');
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.2,
      r: Math.random() * 2 + 0.5, alpha: Math.random() * 0.3
    });
  }

  function draw() {
    if (!running) return;
    c.fillStyle = 'rgba(10, 10, 15, 0.08)';
    c.fillRect(0, 0, w, h);

    const cur = variations[currentListening] || { breath: 0.5, shimmer: 0.3 };

    particles.forEach(p => {
      p.x += p.vx + (Math.random() - 0.5) * 0.2 * cur.breath;
      p.y += p.vy + (Math.random() - 0.5) * 0.15;
      p.alpha += (Math.random() - 0.5) * 0.02;
      p.alpha = Math.max(0.02, Math.min(0.25 + cur.shimmer * 0.15, p.alpha));

      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      c.beginPath();
      c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c.fillStyle = `rgba(120, 120, 180, ${p.alpha})`;
      c.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
}

// --- Controls ---

$('startBtn').addEventListener('click', () => {
  if (!running) {
    running = true;
    $('startBtn').textContent = 'end';
    $('startBtn').classList.add('active');
    $('gridWrap').classList.add('visible');
    $('bottomRow').classList.add('visible');
    const saved = loadState();
    if (saved) {
      paused = saved.paused;
      viewMode = saved.viewMode || 'art';
    }
    $('pauseBtn').textContent = paused ? 'cycle' : 'pause';
    $('pauseBtn').classList.toggle('active', paused);
    $('viewBtn').textContent = viewMode === 'art' ? 'params' : 'art';
    init();
  } else {
    running = false;
    $('startBtn').textContent = 'begin';
    $('startBtn').classList.remove('active');
    $('gridWrap').classList.remove('visible');
    $('bottomRow').classList.remove('visible');
    clearInterval(cycleTimer);
    cancelAnimationFrame(artAnimId);
    for (let i = 0; i < NUM_CELLS; i++) {
      if (slots[i]) { slots[i].destroy(); slots[i] = null; }
    }
    if (ctx) { ctx.close(); ctx = null; }
  }
});

$('pauseBtn').addEventListener('click', () => {
  if (!running) return;
  paused = !paused;
  if (paused) {
    clearInterval(cycleTimer);
    $('pauseBtn').textContent = 'cycle';
    $('pauseBtn').classList.add('active');
  } else {
    startCycling();
    $('pauseBtn').textContent = 'pause';
    $('pauseBtn').classList.remove('active');
  }
  saveState();
});

$('viewBtn').addEventListener('click', () => {
  if (!running) return;
  viewMode = viewMode === 'art' ? 'params' : 'art';
  $('viewBtn').textContent = viewMode === 'art' ? 'params' : 'art';
  renderCells();
  // Re-apply listening state
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => cell.classList.toggle('listening', i === currentListening));
  saveState();
});
</script>
</body>
